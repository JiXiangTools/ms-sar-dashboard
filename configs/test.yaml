app:
  name: ms-sar-dashboard
  env: test
  host: 127.0.0.1
  port: 18081
  read_header_timeout: 3s
  read_timeout: 5s
  write_timeout: 10s
  idle_timeout: 60s
  shutdown_timeout: 10s

security:
  max_request_body_bytes: 1048576
  trusted_proxy_cidrs: []
  rate_limit_store_timeout: 100ms

auth:
  jwt_secret: ms-sar-dashboard-test-secret
  access_token_ttl: 2h
  issuer: ms-sar-dashboard

sso:
  enabled: true
  admin_ui_url: "http://server.muguayun.top:8589/uc-admin"
  api_base_url: "http://server.muguayun.top:8589/"
  app_id: "100001"
  app_secret: "test-only-not-a-real-secret"
  redirect_url: "http://server.muguayun.top:8588/sar-admin"
  request_timeout: 3s

log:
  level: debug

database:
  dsn: postgres://postgres:postgres@127.0.0.1:5432/ms_sar_dashboard_test?sslmode=disable
  max_open_conns: 20
  max_idle_conns: 5
  conn_max_lifetime: 30m
  health_check_timeout: 2s
  migration_timeout: 60s

redis:
  mode: standalone
  addrs:
    - 127.0.0.1:6379
  key_prefix: ""
  db: 1
  dial_timeout: 2s
  read_timeout: 2s
  write_timeout: 2s
  health_check_timeout: 2s

elasticsearch:
  addrs:
    - http://127.0.0.1:9200
  item_index_prefix: ms_search_item
  request_timeout: 5s
  max_response_bytes: 4194304
  debug_enabled: true

recommend_debug:
  max_candidate_limit: 1000
  debug_enabled: true
  online_base_url: http://127.0.0.1:18082
  request_timeout: 5s
