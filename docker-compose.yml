x-ms-sar-dashboard-image: &ms-sar-dashboard-image "${MS_SAR_DASHBOARD_IMAGE:-ms-sar-dashboard:local}"

services:
  ms-sar-dashboard:
    image: *ms-sar-dashboard-image
    container_name: ms-sar-dashboard
    restart: unless-stopped
    cpus: 1.0
    mem_limit: 512m
    environment:
      MSSAR_APP_HOST: 0.0.0.0
      MSSAR_APP_PORT: "8081"
      MSSAR_SECURITY_MAX_REQUEST_BODY_BYTES: "${MSSAR_SECURITY_MAX_REQUEST_BODY_BYTES:-1048576}"
      MSSAR_SECURITY_TRUSTED_PROXY_CIDRS: "${MSSAR_SECURITY_TRUSTED_PROXY_CIDRS:-}"
      MSSAR_SECURITY_RATE_LIMIT_STORE_TIMEOUT: "${MSSAR_SECURITY_RATE_LIMIT_STORE_TIMEOUT:-100ms}"
      MSSAR_STATISTICS_INGEST_TOKEN: "${MSSAR_STATISTICS_INGEST_TOKEN:-}"
      MSSAR_AUTH_JWT_SECRET: "${MSSAR_AUTH_JWT_SECRET:?MSSAR_AUTH_JWT_SECRET is required}"
      MSSAR_DATABASE_DSN: "${MSSAR_DATABASE_DSN:?MSSAR_DATABASE_DSN is required}"
      MSSAR_DATABASE_MIGRATION_TIMEOUT: "${MSSAR_DATABASE_MIGRATION_TIMEOUT:-60s}"
      MSSAR_REDIS_MODE: standalone
      MSSAR_REDIS_KEY_PREFIX: ""
      MSSAR_REDIS_ADDRS: redis:6379
      MSSAR_REDIS_DB: "8"
    command:
      - -config
      - /app/configs/prod.yaml
    ports:
      - "127.0.0.1:${MSSAR_HOST_PORT:-8588}:8081"
    depends_on:
      database-migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - wget -q -O - "http://127.0.0.1:8081/health" >/dev/null 2>&1 || exit 1
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  database-migrate:
    image: *ms-sar-dashboard-image
    restart: "no"
    entrypoint:
      - /app/ms-sar-dbtool
    command: []
    environment:
      MSSAR_DATABASE_DSN: "${MSSAR_DATABASE_MIGRATION_DSN:?MSSAR_DATABASE_MIGRATION_DSN is required}"
      MSSAR_DATABASE_MIGRATION_TIMEOUT: "${MSSAR_DATABASE_MIGRATION_TIMEOUT:-60s}"
      MSSAR_INIT_ADMIN_NAME: "${MSSAR_INIT_ADMIN_NAME:?MSSAR_INIT_ADMIN_NAME is required}"
      MSSAR_INIT_ADMIN_PASSWORD_HASH: "${MSSAR_INIT_ADMIN_PASSWORD_HASH:?MSSAR_INIT_ADMIN_PASSWORD_HASH is required}"
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: "${POSTGRES_IMAGE:-dockerhub.seobot.cc/library/postgres:18.3}"
    container_name: ms-sar-dashboard-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ms_sar_dashboard
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U postgres -d ms_sar_dashboard
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: "${REDIS_IMAGE:-dockerhub.seobot.cc/library/redis:8.6.1}"
    container_name: ms-sar-dashboard-redis
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - "yes"
    volumes:
      - redis-data:/data
    healthcheck:
      test:
        - CMD-SHELL
        - redis-cli ping | grep PONG
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

volumes:
  postgres-data:
  redis-data:
